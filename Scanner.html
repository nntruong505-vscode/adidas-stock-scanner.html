<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<title>ADIDAS BARCODE SCANNER</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  overflow-x: hidden;
}

.header {

  height: 64px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 18px;

  background: #050505;

  border-bottom:
    1px solid #222;

}

.logo {

  font-size: 20px;

  font-weight: 900;

  letter-spacing: .5px;

}

.logo span {

  color: #9cff00;

}

.version {

  color: #999;

  font-size: 11px;

}

/* CAMERA */

.camera {

  position: relative;

  width: 100%;

  max-width: 800px;

  margin: 0 auto;

  background: #111;

  overflow: hidden;

}

video {

  display: block;

  width: 100%;

  height: auto;

  min-height: 260px;

  max-height: 55vh;

  object-fit: cover;

  background: #111;

}

/* SCAN AREA */

.scan-area {

  position: absolute;

  left: 8%;

  right: 8%;

  top: 50%;

  transform: translateY(-50%);

  height: 120px;

  border:

    2px solid rgba(156,255,0,.65);

  border-radius: 10px;

  pointer-events: none;

}

.scan-line {

  position: absolute;

  left: 0;

  right: 0;

  top: 50%;

  height: 2px;

  background: #9cff00;

  box-shadow:

    0 0 12px #9cff00;

  animation:
    scan 1.8s linear infinite;

}

@keyframes scan {

  0% {
    top: 10%;
  }

  50% {
    top: 90%;
  }

  100% {
    top: 10%;
  }

}

/* CONTROLS */

.controls {

  width: 100%;

  max-width: 800px;

  margin: auto;

  padding: 14px;

}

select,
button,
input {

  width: 100%;

  height: 48px;

  border-radius: 8px;

  margin-bottom: 9px;

  font-size: 15px;

  font-weight: 800;

}

select {

  padding: 0 12px;

  background: #fff;

  color: #111;

  border: 0;

}

button {

  border: 0;

  background: #fff;

  color: #000;

}

button.black {

  background: #111;

  color: #fff;

  border:
    1px solid #555;

}

button.green {

  background: #9cff00;

  color: #000;

}

/* MANUAL */

.manual {

  display: flex;

  gap: 7px;

}

.manual input {

  flex: 1;

  padding: 0 12px;

  border: 0;

  margin: 0;

}

.manual button {

  width: 80px;

  margin: 0;

}

/* RESULT */

.result {

  width: 100%;

  max-width: 800px;

  margin: 5px auto 20px;

  padding: 18px;

  background: #111;

  border-radius: 10px;

  text-align: center;

}

.result-code {

  font-size: 28px;

  font-weight: 900;

  word-break: break-all;

}

.status {

  margin-top: 8px;

  color: #aaa;

  font-size: 12px;

  line-height: 1.5;

}

.status.ok {

  color: #9cff00;

}

.status.error {

  color: #ff6666;

}

/* DEBUG */

.debug {

  margin-top: 10px;

  color: #666;

  font-size: 9px;

  word-break: break-all;

}

/* HIDDEN */

.hidden {
  display: none !important;
}

</style>

</head>

<body>


<header class="header">

  <div class="logo">

    ADIDAS <span>SCANNER</span>

  </div>

  <div class="version">

    V5.1

  </div>

</header>


<!-- CAMERA -->

<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline>
  </video>

  <div class="scan-area">

    <div class="scan-line"></div>

  </div>

</div>


<!-- CONTROLS -->

<div class="controls">


  <select id="camera-select">

    <option value="">

      Camera mặc định

    </option>

  </select>


  <button
    onclick="startCamera()">

    📷 BẬT CAMERA

  </button>


  <button
    class="black"
    onclick="stopCamera()">

    ⏹ DỪNG CAMERA

  </button>


  <button
    class="black"
    onclick="switchCamera()">

    🔄 ĐỔI CAMERA

  </button>


  <button
    class="black"
    onclick="manualReturn()">

    ↩ QUAY LẠI

  </button>


  <div class="manual">

    <input
      id="manual-code"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Nhập EAN thủ công"
    >

    <button
      class="green"
      onclick="manualScan()">

      OK

    </button>

  </div>


</div>


<!-- RESULT -->

<div class="result">

  <div
    id="result-code"
    class="result-code">

    Sẵn sàng quét

  </div>


  <div
    id="status"
    class="status">

    Nhấn BẬT CAMERA để bắt đầu.

  </div>


  <div
    id="debug"
    class="debug">

  </div>

</div>


<!-- ZXING -->

<script
  src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js">
</script>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let codeReader = null;

let stream = null;

let currentDeviceId = '';

let devices = [];

let scanning = false;

let lastScan = '';

let lastScanTime = 0;


/* =====================================================
   RETURN URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const returnUrl =
  params.get('return') || '';


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
  'load',
  function() {

    init();

  }
);


/* =====================================================
   INIT
===================================================== */

async function init() {

  setStatus(
    'Đang kiểm tra camera...'
  );

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Trình duyệt không hỗ trợ camera.'
      );

    }


    /*
     * Khởi tạo ZXing
     */

    codeReader =
      new ZXing.BrowserMultiFormatReader();


    /*
     * KHÔNG yêu cầu camera ngay tại đây.
     *
     * Trên iPhone Safari,
     * enumerateDevices trước khi
     * cấp quyền có thể trả label/device
     * không đầy đủ.
     */

    setStatus(
      'Sẵn sàng. Nhấn BẬT CAMERA.'
    );


  } catch(error) {

    showError(error);

  }

}


/* =====================================================
   GET DEVICES
===================================================== */

async function loadDevices() {

  try {

    devices =
      await navigator
        .mediaDevices
        .enumerateDevices();


    const cameras =
      devices.filter(
        function(device) {

          return device.kind ===
            'videoinput';

        }
      );


    const select =
      document.getElementById(
        'camera-select'
      );


    select.innerHTML = '';


    if (!cameras.length) {

      select.innerHTML = `

        <option value="">

          Camera mặc định

        </option>

      `;

      return;

    }


    cameras.forEach(
      function(camera,index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.deviceId;


        option.textContent =
          camera.label ||
          (
            'Camera ' +
            (index + 1)
          );


        select.appendChild(
          option
        );

      }
    );


    /*
     * Ưu tiên camera sau
     */

    const backCamera =
      cameras.find(
        function(camera) {

          return /back|rear|environment/i
            .test(
              camera.label || ''
            );

        }
      );


    if (backCamera) {

      select.value =
        backCamera.deviceId;

    }


    currentDeviceId =
      select.value || '';


  } catch(error) {

    console.log(
      'enumerateDevices error',
      error
    );

  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  stopCamera();


  setStatus(
    'Đang mở camera...'
  );


  try {

    /*
     * Sau khi người dùng bấm nút,
     * gọi getUserMedia trực tiếp.
     */

    let constraints;


    /*
     * Nếu người dùng đã chọn camera
     */

    if (currentDeviceId) {

      constraints = {

        video: {

          deviceId: {

            ideal:
              currentDeviceId

          },

          width: {

            ideal: 1280

          },

          height: {

            ideal: 720

          }

        },

        audio: false

      };

    } else {

      /*
       * Không ép camera.
       * Chỉ ưu tiên camera sau.
       */

      constraints = {

        video: {

          facingMode: {

            ideal:
              'environment'

          },

          width: {

            ideal: 1280

          },

          height: {

            ideal: 720

          }

        },

        audio: false

      };

    }


    /*
     * Lần 1
     */

    try {

      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            constraints
          );

    } catch(firstError) {

      console.warn(
        'Camera constraint failed:',
        firstError
      );


      /*
       * FALLBACK QUAN TRỌNG
       *
       * Không yêu cầu deviceId,
       * không yêu cầu facingMode,
       * không yêu cầu resolution.
       */

      setStatus(
        'Đang thử chế độ camera tương thích...'
      );


      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: true,

            audio: false

          });

    }


    /*
     * Gắn stream vào video
     */

    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      stream;


    /*
     * iPhone Safari
     */

    video.setAttribute(
      'playsinline',
      ''
    );

    video.setAttribute(
      'webkit-playsinline',
      ''
    );

    video.muted = true;


    await video.play();


    scanning = true;


    /*
     * Sau khi đã mở camera,
     * cập nhật danh sách camera.
     */

    await loadDevices();


    /*
     * Bắt đầu ZXing
     */

    startZXing();


    setStatus(
      'Camera đang hoạt động — đưa barcode vào khung.',
      'ok'
    );


  } catch(error) {

    console.error(
      'START CAMERA ERROR',
      error
    );


    showCameraError(
      error
    );

  }

}


/* =====================================================
   ZXING
===================================================== */

function startZXing() {

  if (!codeReader) {

    codeReader =
      new ZXing.BrowserMultiFormatReader();

  }


  const video =
    document.getElementById(
      'video'
    );


  try {

    /*
     * Dùng stream hiện tại.
     *
     * Không dùng:
     * decodeFromVideoDevice()
     *
     * vì đó chính là phần dễ gây
     * Invalid constraint trên iPhone.
     */

    codeReader.decodeFromStream(
      stream,
      video,
      function(result,error) {

        if (!scanning) {

          return;

        }


        if (result) {

          const code =
            result.getText();


          handleScan(
            code
          );

        }

      }
    );


  } catch(error) {

    console.error(
      'ZXING ERROR',
      error
    );


    setStatus(
      'Camera đã mở nhưng Scanner chưa khởi động: ' +
      error.message,
      'error'
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

  scanning = false;


  try {

    if (codeReader) {

      codeReader.reset();

    }

  } catch(e) {}


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          try {

            track.stop();

          } catch(e) {}

        }
      );

    stream = null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (video) {

    video.pause();

    video.srcObject = null;

  }


  setStatus(
    'Camera đã dừng.'
  );

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera() {

  stopCamera();


  await loadDevices();


  if (!devices.length) {

    setStatus(
      'Không tìm thấy camera.'
    );

    return;

  }


  const select =
    document.getElementById(
      'camera-select'
    );


  const options =
    Array.from(
      select.options
    );


  if (!options.length) {

    return;

  }


  let index =
    select.selectedIndex;


  index++;


  if (
    index >= options.length
  ) {

    index = 0;

  }


  select.selectedIndex =
    index;


  currentDeviceId =
    select.value;


  startCamera();

}


/* =====================================================
   SELECT CAMERA
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    const select =
      document.getElementById(
        'camera-select'
      );


    select.addEventListener(
      'change',
      function() {

        currentDeviceId =
          this.value;


        if (stream) {

          startCamera();

        }

      }
    );

  }
);


/* =====================================================
   SCAN RESULT
===================================================== */

function handleScan(code) {

  code =
    String(code || '')
      .trim();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  /*
   * Chống quét trùng
   */

  if (

    code === lastScan &&

    now - lastScanTime < 1800

  ) {

    return;

  }


  lastScan =
    code;


  lastScanTime =
    now;


  document
    .getElementById(
      'result-code'
    )
    .innerText =
      code;


  setStatus(
    '✓ Đã quét thành công.',
    'ok'
  );


  /*
   * Dừng camera
   */

  stopCamera();


  /*
   * Trả về Apps Script
   */

  returnToApp(
    code
  );

}


/* =====================================================
   RETURN TO APPS SCRIPT
===================================================== */

function returnToApp(code) {

  if (!returnUrl) {

    setStatus(
      'Đã quét ' +
      code +
      ' nhưng không có URL quay lại Apps Script.',
      'error'
    );

    return;

  }


  const separator =
    returnUrl.indexOf('?') >= 0
      ? '&'
      : '?';


  const url =
    returnUrl +
    separator +
    'scan=' +
    encodeURIComponent(
      code
    );


  setStatus(
    'Đang quay lại STOCK...',
    'ok'
  );


  setTimeout(
    function() {

      window.location.href =
        url;

    },
    500
  );

}


/* =====================================================
   MANUAL SCAN
===================================================== */

function manualScan() {

  const input =
    document.getElementById(
      'manual-code'
    );


  const code =
    input.value.trim();


  if (!code) {

    setStatus(
      'Vui lòng nhập EAN.'
    );

    input.focus();

    return;

  }


  handleScan(
    code
  );

}


/* =====================================================
   MANUAL RETURN
===================================================== */

function manualReturn() {

  stopCamera();


  if (returnUrl) {

    window.location.href =
      returnUrl;

  } else {

    window.history.back();

  }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  text,
  type
) {

  const status =
    document.getElementById(
      'status'
    );


  status.innerText =
    text;


  status.className =
    'status ' +
    (type || '');

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

  console.error(
    error
  );


  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  setStatus(
    'Lỗi: ' + message,
    'error'
  );

}


/* =====================================================
   CAMERA ERROR
===================================================== */

function showCameraError(error) {

  let message =
    'Không thể mở camera.';


  if (!error) {

    setStatus(
      message,
      'error'
    );

    return;

  }


  console.error(
    error.name,
    error.message
  );


  switch(
    error.name
  ) {

    case 'NotAllowedError':

      message =
        'Camera bị từ chối. Hãy vào Cài đặt → Safari → Camera và chọn Cho phép.';

      break;


    case 'NotFoundError':

      message =
        'Không tìm thấy camera trên thiết bị.';

      break;


    case 'NotReadableError':

      message =
        'Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng khác rồi thử lại.';

      break;


    case 'OverconstrainedError':

    case 'ConstraintNotSatisfiedError':

      message =
        'Thiết lập camera không tương thích. Hệ thống đã thử chế độ dự phòng.';

      break;


    case 'SecurityError':

      message =
        'Trình duyệt đang chặn quyền camera.';

      break;


    default:

      message =
        'Không thể mở camera: ' +
        (
          error.message ||
          error.name ||
          'Unknown error'
        );

  }


  setStatus(
    message,
    'error'
  );


  document
    .getElementById(
      'debug'
    )
    .innerText =
      (
        error.name || ''
      ) +
      ' — ' +
      (
        error.message || ''
      );

}


/* =====================================================
   ENTER MANUAL
===================================================== */

document.addEventListener(
  'keydown',
  function(e) {

    if (
      e.key === 'Enter'
    ) {

      const input =
        document.getElementById(
          'manual-code'
        );


      if (
        document.activeElement ===
        input
      ) {

        manualScan();

      }

    }

  }
);

</script>

</body>

</html>
