<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADIDAS SCANNER</title>
  
  <!-- HTML5-QRCode Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      height: 60px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #333;
      z-index: 10;
    }
    .title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .title span {
      color: #76ff00;
    }
    .cancel-btn {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .scanner-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }
    #reader {
      width: 100%;
      height: 100%;
      background: #000;
    }
    /* Hide the default messy UI of the library */
    #reader__dashboard_section_csr span,
    #reader__dashboard_section_swaplink {
      color: #fff !important;
    }
    .status-bar {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      width: 80%;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">SCAN <span>BARCODE</span></div>
    <button class="cancel-btn" onclick="goBack()">HỦY</button>
  </div>

  <div class="scanner-container">
    <div id="reader"></div>
    <div id="status" class="status-bar">Đang khởi động camera...</div>
  </div>

  <script>
    // 1. Get the return URL from Apps Script
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('return');

    // 2. Setup the Scanner instance
    const html5QrCode = new Html5Qrcode("reader");

    // 3. Handle successful scans
    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById('status').innerText = "Đã quét: " + decodedText;
      document.getElementById('status').style.color = "#76ff00";
      
      // Stop scanning to prevent multiple triggers
      html5QrCode.stop().then(() => {
        // Redirect back to the Apps Script Web App with the scanned EAN
        if (returnUrl) {
          // Check if returnUrl already has query params, if so use '&', else '?'
          const separator = returnUrl.includes('?') ? '&' : '?';
          window.location.href = returnUrl + separator + 'scan=' + encodeURIComponent(decodedText);
        } else {
          alert("Quét thành công: " + decodedText + "\n(Không tìm thấy link trả về)");
        }
      }).catch((err) => {
        console.error("Lỗi khi dừng camera", err);
      });
    }

    // 4. Start the camera
    const config = { 
      fps: 10, 
      qrbox: { width: 300, height: 150 }, 
      aspectRatio: window.innerWidth / window.innerHeight,
      
      // ONLY scan EAN-13 barcodes
      formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13 ] 
    };

    html5QrCode.start(
      { facingMode: "environment" }, // Force rear camera
      config,
      onScanSuccess,
      (errorMessage) => {
        // Ignored. The library throws errors continuously while searching for a code.
      }
    ).then(() => {
      document.getElementById('status').innerText = "Hướng camera vào mã vạch (EAN/UPC)...";
    }).catch((err) => {
      document.getElementById('status').innerText = "Lỗi truy cập Camera. Vui lòng cấp quyền!";
      document.getElementById('status').style.color = "#ff4d4d";
      console.error(err);
    });

    // 5. Cancel button behavior
    function goBack() {
      html5QrCode.stop().catch(e => console.error(e));
      if (returnUrl) {
        window.location.href = returnUrl;
      } else {
        window.close(); // Fallback if no return URL exists
      }
    }
  </script>

</body>
</html>
