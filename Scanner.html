<!DOCTYPE html>
<html>

<head>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>ADIDAS BARCODE SCANNER</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #000;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

.header {

  height: 58px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 15px;

  background: #050505;

}

.logo {

  font-size: 16px;

  font-weight: 900;

}

.logo span {

  color: #9cff00;

}

.version {

  font-size: 9px;

  color: #999;

}

.camera {

  position: relative;

  width: 100%;

  max-width: 700px;

  margin: auto;

  background: #111;

}

video {

  width: 100%;

  display: block;

  background: #111;

}

.scan-line {

  position: absolute;

  left: 10%;

  right: 10%;

  top: 50%;

  height: 2px;

  background: #9cff00;

  box-shadow:
    0 0 10px #9cff00;

}

.controls {

  padding: 12px;

  max-width: 700px;

  margin: auto;

}

select,
button {

  width: 100%;

  height: 44px;

  border-radius: 6px;

  border: 0;

  margin-bottom: 7px;

  font-weight: 900;

}

select {

  padding: 0 10px;

}

button {

  background: #fff;

  color: #000;

}

button.black {

  background: #111;

  border: 1px solid #555;

  color: #fff;

}

.result {

  max-width: 700px;

  margin: 10px auto;

  padding: 15px;

  background: #111;

  border-radius: 7px;

  text-align: center;

}

.result-code {

  font-size: 26px;

  font-weight: 900;

  word-break: break-all;

}

.status {

  font-size: 11px;

  color: #aaa;

  margin-top: 7px;

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">

    ADIDAS <span>SCANNER</span>

  </div>

  <div class="version">

    V5.0

  </div>

</header>


<div class="camera">

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <div class="scan-line"></div>

</div>


<div class="controls">

  <select
    id="camera-select">

    <option>

      Đang tải camera...

    </option>

  </select>


  <button
    onclick="startScanner()">

    📷 BẬT CAMERA

  </button>


  <button
    class="black"
    onclick="stopScanner()">

    ⏹ DỪNG CAMERA

  </button>


  <button
    class="black"
    onclick="manualReturn()">

    ↩ QUAY LẠI

  </button>

</div>


<div class="result">

  <div
    id="result-code"
    class="result-code">

    Sẵn sàng quét

  </div>

  <div
    id="status"
    class="status">

    Cấp quyền camera nếu trình duyệt yêu cầu.

  </div>

</div>


<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>


<script>

let codeReader = null;

let currentDeviceId = '';

let returnUrl =
  new URLSearchParams(
    window.location.search
  ).get('return');


/* =====================================================
   INIT
===================================================== */

window.addEventListener(
  'load',
  function() {

    initScanner();

  }
);


/* =====================================================
   INIT
===================================================== */

async function initScanner() {

  setStatus(
    'Đang kiểm tra camera...'
  );

  try {

    codeReader =
      new ZXing.BrowserMultiFormatReader();

    const devices =
      await codeReader.listVideoInputDevices();

    const select =
      document.getElementById(
        'camera-select'
      );

    select.innerHTML = '';

    if (
      !devices ||
      !devices.length
    ) {

      setStatus(
        'Không tìm thấy camera. Hãy kiểm tra quyền camera.'
      );

      return;

    }

    devices.forEach(
      function(device,index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          device.deviceId;

        option.textContent =
          device.label ||
          (
            'Camera ' +
            (index + 1)
          );

        select.appendChild(
          option
        );

      }
    );

    /*
     * Ưu tiên camera sau.
     */

    const backCamera =
      devices.find(
        function(device) {

          return /back|rear|environment/i
            .test(
              device.label || ''
            );

        }
      );

    if (backCamera) {

      select.value =
        backCamera.deviceId;

    }

    currentDeviceId =
      select.value;

    setStatus(
      'Đã tìm thấy ' +
      devices.length +
      ' camera.'
    );

    /*
     * Không tự bật camera ngay.
     * Người dùng bấm BẬT CAMERA.
     */

  } catch(error) {

    console.error(error);

    setStatus(
      'Không thể truy cập camera: ' +
      error.message
    );

  }

}


/* =====================================================
   START
===================================================== */

async function startScanner() {

  if (!codeReader) {

    await initScanner();

  }

  const select =
    document.getElementById(
      'camera-select'
    );

  currentDeviceId =
    select.value;

  if (!currentDeviceId) {

    setStatus(
      'Chưa chọn camera.'
    );

    return;

  }

  setStatus(
    'Đang mở camera...'
  );

  try {

    await codeReader.decodeFromVideoDevice(
      currentDeviceId,
      'video',
      function(result, error) {

        if (result) {

          const code =
            result.getText();

          handleScan(
            code
          );

        }

      }
    );

    setStatus(
      'Camera đang hoạt động — đưa barcode vào khung.'
    );

  } catch(error) {

    console.error(error);

    setStatus(
      'Không thể mở camera: ' +
      error.message
    );

  }

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

  if (codeReader) {

    try {

      codeReader.reset();

    } catch(e) {}

  }

  const video =
    document.getElementById(
      'video'
    );

  if (
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    video.srcObject = null;

  }

  setStatus(
    'Camera đã dừng.'
  );

}


/* =====================================================
   SCAN
===================================================== */

let lastScan = '';

let lastScanTime = 0;


function handleScan(code) {

  const now =
    Date.now();

  /*
   * Chống quét lặp cùng barcode.
   */

  if (
    code === lastScan &&
    now - lastScanTime < 1800
  ) {

    return;

  }

  lastScan =
    code;

  lastScanTime =
    now;

  document
    .getElementById(
      'result-code'
    )
    .innerText =
      code;

  setStatus(
    'Đã quét thành công.'
  );


  /*
   * Trả về Apps Script.
   */

  if (returnUrl) {

    const separator =
      returnUrl.indexOf('?') >= 0
        ? '&'
        : '?';

    const url =
      returnUrl +
      separator +
      'scan=' +
      encodeURIComponent(
        code
      );

    setTimeout(
      function() {

        window.location.href =
          url;

      },
      400
    );

  }

}


/* =====================================================
   MANUAL RETURN
===================================================== */

function manualReturn() {

  if (returnUrl) {

    window.location.href =
      returnUrl;

  } else {

    window.history.back();

  }

}


/* =====================================================
   CAMERA CHANGE
===================================================== */

document
  .getElementById(
    'camera-select'
  )
  .addEventListener(
    'change',
    function() {

      currentDeviceId =
        this.value;

      /*
       * Nếu camera đang chạy,
       * khởi động lại.
       */

      if (
        codeReader
      ) {

        startScanner();

      }

    }
  );


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  document
    .getElementById(
      'status'
    )
    .innerText =
      text;

}

</script>

</body>

</html>
