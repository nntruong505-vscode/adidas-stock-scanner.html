<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quét Mã Vạch</title>
  
  <!-- Tải thư viện HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden; /* Chống cuộn trang */
    }

    /* Vùng chứa camera toàn màn hình */
    #reader {
      width: 100vw;
      height: 100vh;
    }

    /* Ép video vừa khít màn hình điện thoại */
    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Nút Hủy (dấu X) để thoát nếu không quét được */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      cursor: pointer;
      text-decoration: none;
    }

    /* Khung ngắm (chữ nhật) */
    #reader__scan_region {
      background: transparent !important;
    }
  </style>
</head>
<body>

  <!-- Nút thoát khẩn cấp -->
  <div class="close-btn" onclick="goBack()">✕</div>

  <!-- Vùng hiển thị Camera -->
  <div id="reader"></div>

  <script>
    // Lấy link Web App để quay về
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('return');

    // Khởi tạo đối tượng Core API (Không dùng giao diện mặc định của thư viện)
    const html5QrCode = new Html5Qrcode("reader");

    // Hàm tự động quay về Web App khi quét thành công
    function onScanSuccess(decodedText) {
      // Dừng camera ngay lập tức để không quét đúp
      html5QrCode.stop().then(() => {
        if (returnUrl) {
          const separator = returnUrl.includes('?') ? '&' : '?';
          window.location.href = returnUrl + separator + 'scan=' + encodeURIComponent(decodedText);
        } else {
          alert("Quét thành công: " + decodedText);
        }
      });
    }

    // Tự động bật camera ngay khi trang web tải xong
    window.onload = () => {
      const config = {
        fps: 10, 
        qrbox: { width: window.innerWidth * 0.8, height: 150 }, // Khung quét hình chữ nhật cho mã EAN
        aspectRatio: window.innerHeight / window.innerWidth, // Tối ưu hiển thị dọc
        formatsToSupport: [ 
          Html5QrcodeSupportedFormats.EAN_13, 
          Html5QrcodeSupportedFormats.UPC_A 
        ] // CHỈ quét mã giày Adidas, bỏ qua các mã QR tạp
      };

      // Tự động mở Camera Sau (environment)
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        alert("Lỗi: Không thể mở camera. Vui lòng kiểm tra quyền truy cập camera của trình duyệt!");
      });
    };

    // Hàm xử lý nút ✕
    function goBack() {
      html5QrCode.stop().then(() => {
        if (returnUrl) window.location.href = returnUrl;
      }).catch(() => {
        if (returnUrl) window.location.href = returnUrl;
      });
    }
  </script>

</body>
</html>
